# Customer UAT: book / bookings navigation (no Live Razorpay)
# Prefer a logged-in session (run customer-login-home first, or omit clearState)
appId: com.oorjaman.customer.uat
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 45000
- tapOn:
    text: "Home"
    optional: true
- tapOn:
    text: "Book a visit"
    optional: true
- tapOn:
    text: "Book cleaning"
    optional: true
- waitForAnimationToEnd
- back
- tapOn: "Bookings"
- waitForAnimationToEnd
- tapOn:
    text: "Preferred partners"
    optional: true
- back
