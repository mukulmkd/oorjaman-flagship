# Customer UAT: email OTP login → home
# Requires com.oorjaman.customer.uat; dummy OTP 123456
# Override: maestro test -e CUSTOMER_EMAIL=you@example.com …
appId: com.oorjaman.customer.uat
env:
  CUSTOMER_EMAIL: raju.mahalingam@gmail.com
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in with email"
    timeout: 45000
- tapOn: "Email"
- tapOn:
    text: "you@example.com"
    optional: true
- eraseText
- inputText: ${CUSTOMER_EMAIL}
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "One-time code"
    timeout: 30000
- tapOn: "One-time code"
- eraseText
- inputText: "123456"
- tapOn: "Verify and continue"
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
