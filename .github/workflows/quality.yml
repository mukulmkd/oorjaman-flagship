name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run analyze:knip

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Soft coverage gate (packages/api targeted modules)
        run: npm run test:coverage:api
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            packages/api/coverage/coverage-summary.json
            packages/api/coverage/index.html
          if-no-files-found: ignore
